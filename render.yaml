services:
  - type: web
    name: meezan
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: meezan-data
      mountPath: /app/data
      sizeGB: 1
